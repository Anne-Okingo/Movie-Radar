<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieRadar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="navbar">
    <ul>
      <li><a href="#trending">Home</a></li>
      <li><a href="#recommendations">Recommendations</a></li>
      <li><a href="#watchlist">Watchlist</a></li>
      <li><a href="#search-results">Search</a></li>
    </ul>
  </nav>
  <header>
    <h1>MovieRadar</h1>
    <input id="search-input" type="text" placeholder="Search for movies or TV shows...">
  </header>
  <main class="main-layout">
    <section id="all-movies-main">
      <h2>All Movies</h2>
      <div id="all-movies-list"></div>
      <div id="all-movies-pagination"></div>
    </section>
    <aside id="sidebar">
      <section id="trending">
        <h2>Trending</h2>
        <div id="trending-list"></div>
      </section>
      <section id="search-results">
        <h2>Search Results</h2>
        <div id="results-list"></div>
      </section>
      <section id="watchlist">
        <h2>My Watchlist</h2>
        <div id="watchlist-list"></div>
      </section>
      <section id="recommendations">
        <h2>Recommended for You</h2>
        <div id="recommend-list"></div>
      </section>
    </aside>
    <script src="app.js"></script>
    <div id="details-modal" style="display:none;"></div>
  </main>
</body>
</html>
